<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · OneInbox</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <form id="login" class="notice">
    <div class="brand"><span class="logo" aria-hidden="true"></span>OneInbox</div>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" autofocus required>
    <button class="btn primary" type="submit">Sign in</button>
    <p id="login-error" class="error" role="alert"></p>
  </form>
  <script src="/login.js"></script>
</body>
</html>
